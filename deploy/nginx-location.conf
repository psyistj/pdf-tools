# Include inside the hub.plustech.cc HTTPS server, before its catch-all route.
location = /pdf-tools {
    return 308 /pdf-tools/$is_args$args;
}

location ^~ /pdf-tools/ {
    alias /srv/pdf-tools/current/;
    index index.html;
    autoindex off;

    # .mjs must be a script type or the pdf.js module worker is refused.
    types {
        text/html html htm;
        text/css css;
        application/javascript js mjs;
        application/wasm wasm;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg;
        application/pdf pdf;
        font/ttf ttf;
        application/octet-stream bcmap pfb;
    }
    default_type application/octet-stream;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Local vendor only. wasm-unsafe-eval is required by the pdf.js image decoder; no external host is allowed.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
